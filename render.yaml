# Render 블루프린트: GitHub 저장소를 연결하면 이 파일대로 서비스, 영구 디스크, 환경 변수 칸이 만들어진다.
# 값이 필요한 칸(sync: false)은 Render 화면에서 직접 채운다. 키는 이 파일이나 GitHub에 적지 않는다.
services:
  - type: web
    name: naru-post
    runtime: docker
    plan: starter            # 영구 디스크는 유료 요금제에서만 붙일 수 있다
    healthCheckPath: /api/health
    disk:
      name: naru-data
      mountPath: /data       # naru.db와 백업이 저장되는 곳. 재배포·재시작해도 남는다
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL           # Render가 준 주소(https://…onrender.com)를 넣는다. 서비스를 만든 뒤에 알 수 있다
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY       # 메일을 쓸 때만
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_TOKEN          # 관리자 화면 토큰: Render가 무작위로 만들어 준다(환경 변수 화면에서 볼 수 있다)
        generateValue: true
